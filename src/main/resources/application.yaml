spring:
  application:
    name: employee-management

  datasource:
    #url: jdbc:mysql://${TIDB_HOST}:4000/${TIDB_DATABASE}?sslMode=VERIFY_IDENTITY
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/employee-management?sslMode=VERIFY_IDENTITY
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always